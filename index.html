<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gondol-Ku Mobile</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: linear-gradient(#e6f2ff, #ffffff);
  color: #003366;
}

/* 🔝 TOPO */
.top-bar {
  text-align: center;
  padding: 10px;
}

.top-bar h1 {
  margin: 5px;
  font-size: 22px;
}

.top-bar select {
  font-size: 16px;
  padding: 6px;
}

/* INFO */
.info {
  display: flex;
  justify-content: center;
  gap: 20px;
  font-size: 18px;
  font-weight: bold;
}

/* LAYOUT MOBILE */
.game-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  padding: 10px;
}

/* 📋 REGRAS */
.rules-box {
  width: 95%;
  background: white;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
}

/* 🎲 TABULEIRO */
.container {
  display: grid;
  grid-template-columns: 30px repeat(3, 70px) 30px;
  grid-template-rows: 30px repeat(3, 70px) 30px;
  gap: 6px;
  padding: 10px;
  background: #cce6ff;
  border-radius: 10px;
}

.cell {
  width: 70px;
  height: 70px;
  font-size: 28px;
  border-radius: 10px;
  border: 2px solid #3399ff;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
}

.header, .footer, .side, .sideR {
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 🔢 NÚMEROS */
.side-pieces {
  width: 95%;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

#pieces {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.piece {
  height: 55px;
  font-size: 24px;
  border-radius: 10px;
  background: #99ccff;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #003366;
}

.selected {
  border: 3px solid red !important;
}

/* BOTÕES GRANDES */
.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 95%;
}

button {
  padding: 12px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  background: #3399ff;
  color: white;
}

#message {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  padding: 10px;
}
</style>
</head>

<body>

<div class="top-bar">
  <h1>📘 Gondol-Ku</h1>
  <select id="levelSelect" onchange="newGame()">
    <option value="easy">Fácil</option>
    <option value="medium" selected>Médio</option>
    <option value="hard">Difícil</option>
  </select>
</div>

<div class="info">
  ⏱️ <span id="tempo">0:00</span>
</div>

<div class="game-wrapper">

  <div class="rules-box">
    <b>Regras:</b><br>
    • Use números de 1 a 9<br>
    • Não repita<br>
    • Respeite somas
  </div>

  <div id="container" class="container"></div>

  <div class="side-pieces">
    <div id="pieces"></div>
  </div>

  <div class="controls">
    <button onclick="checkSolution()">✔ Verificar</button>
    <button onclick="newGame()">🔄 Novo</button>
    <button onclick="resetPieces()">♻ Reiniciar</button>
  </div>

</div>

<p id="message"></p>

<script>
let solution, board, rowTargets, colTargets;
let selectedNumber=null;
let seconds=0, timer;

function startTimer(){
  clearInterval(timer);
  seconds=0;
  timer=setInterval(()=>{
    seconds++;
    tempo.textContent=`${Math.floor(seconds/60)}:${(seconds%60).toString().padStart(2,"0")}`;
  },1000);
}

function createPieces(used){
  pieces.innerHTML="";
  for(let n=1;n<=9;n++){
    if(used.includes(n)) continue;

    let p=document.createElement("div");
    p.className="piece";
    p.textContent=n;

    p.onclick=()=>{
      selectedNumber=n;
      document.querySelectorAll(".piece").forEach(el=>el.classList.remove("selected"));
      p.classList.add("selected");
    };

    pieces.appendChild(p);
  }
}

function createBoard(){
  container.innerHTML="";

  container.appendChild(document.createElement("div"));
  colTargets.forEach(v=>{
    let d=document.createElement("div");
    d.className="header";
    d.textContent=v;
    container.appendChild(d);
  });
  container.appendChild(document.createElement("div"));

  for(let r=0;r<3;r++){
    let s=document.createElement("div");
    s.className="side";
    s.textContent=rowTargets[r];
    container.appendChild(s);

    for(let c=0;c<3;c++){
      let cell=document.createElement("div");
      cell.className="cell";

      if(board[r][c]) cell.textContent=board[r][c];

      cell.onclick=()=>{
        if(board[r][c]){
          board[r][c]=null;
          cell.textContent="";
          createPieces(board.flat().filter(n=>n));
          return;
        }

        if(!selectedNumber) return;
        if(board.flat().includes(selectedNumber)) return;

        board[r][c]=selectedNumber;
        cell.textContent=selectedNumber;
        createPieces(board.flat().filter(n=>n));
        selectedNumber=null;
      };

      container.appendChild(cell);
    }

    let s2=document.createElement("div");
    s2.className="sideR";
    s2.textContent=rowTargets[r];
    container.appendChild(s2);
  }

  container.appendChild(document.createElement("div"));
  colTargets.forEach(v=>{
    let d=document.createElement("div");
    d.className="footer";
    d.textContent=v;
    container.appendChild(d);
  });
  container.appendChild(document.createElement("div"));
}

function generatePuzzle(){
  let nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
  solution=[nums.slice(0,3),nums.slice(3,6),nums.slice(6,9)];

  rowTargets=solution.map(r=>r.reduce((a,b)=>a+b,0));
  colTargets=[0,1,2].map(c=>solution[0][c]+solution[1][c]+solution[2][c]);

  board=Array(3).fill().map(()=>Array(3).fill(null));

  let level=levelSelect.value;
  let idx=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-0.5);
  let qtd=level==="easy"?4:level==="medium"?2:0;

  let used=[];
  idx.slice(0,qtd).forEach(i=>{
    let r=Math.floor(i/3),c=i%3;
    board[r][c]=solution.flat()[i];
    used.push(board[r][c]);
  });

  createPieces(used);
}

function checkSolution(){
  let nums=board.flat();

  if(nums.includes(null)) return message.textContent="Preencha tudo!";
  if(new Set(nums).size!==9) return message.textContent="Sem repetir!";

  for(let r=0;r<3;r++)
    if(board[r].reduce((a,b)=>a+b,0)!==rowTargets[r])
      return message.textContent="Confira linhas";

  for(let c=0;c<3;c++)
    if(board[0][c]+board[1][c]+board[2][c]!==colTargets[c])
      return message.textContent="Confira colunas";

  message.textContent="🎉 Acertou!";
}

function resetPieces(){
  generatePuzzle();
  createBoard();
}

function newGame(){
  generatePuzzle();
  createBoard();
  message.textContent="";
  startTimer();
}

newGame();
</script>

</body>
</html>
